<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Partez libre, restez connecté !">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sunday Tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Sunday Tracker</title>

  <!-- Aperçu du lien partagé (WhatsApp, iMessage, Signal…) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sunday Tracker">
  <meta property="og:description" content="Partez libre, restez connecté !">

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Sunday Tracker Live est 100% en ligne : on n'utilise PAS de service worker
    // (build avec --pwa-strategy=none). Ce script desinscrit tout ancien service
    // worker et vide ses caches, ce qui debloque automatiquement les utilisateurs
    // restes coinces sur une version figee, sans aucune manip de leur part.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var hadSW = regs.length > 0;
        var jobs = regs.map(function (r) { return r.unregister(); });
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        Promise.all(jobs).then(function () {
          // Si un ancien SW controlait la page, on recharge une seule fois pour
          // repartir sur une base propre servie directement par le serveur.
          if (hadSW && !sessionStorage.getItem('sw_cleaned')) {
            sessionStorage.setItem('sw_cleaned', '1');
            window.location.reload();
          }
        });
      }).catch(function () {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
